name: Package snapshot

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/reference-kit/**"
      - "diagnose-lib/**"
      - "packaging/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/package-snapshot.yml"

permissions:
  contents: read

jobs:
  linux-x64:
    name: Build Linux x64 acceptance candidate (no live workload)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned controller Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Run hermetic packaging tests
        run: npm run test:distribution

      - name: Check shell syntax
        run: |
          bash -n src/reference-kit/run-reference
          bash -n packaging/templates/prepare-results

      - name: Build version-neutral stage
        run: >-
          node packaging/stage-linux.mjs
          --output-directory "$RUNNER_TEMP/linux-stage"
          --runtime-cache "$RUNNER_TEMP/runtime-cache"

      - name: Finalize commit-bound acceptance candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          candidate_version="0.1.0-dev.${SOURCE_COMMIT:0:12}"
          node packaging/finalize-release.mjs \
            --stage "$RUNNER_TEMP/linux-stage/fault-affinity-live-linux-x64.stage.tar.gz" \
            --output-directory "$RUNNER_TEMP/acceptance" \
            --version "$candidate_version" \
            --commit "$SOURCE_COMMIT" \
            --source-date-epoch "$source_date_epoch"
          printf 'Acceptance candidate `%s` for commit `%s`\n' \
            "$candidate_version" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify candidate bytes and harmless launcher output
        run: |
          (cd "$RUNNER_TEMP/acceptance" && sha256sum --check SHA256SUMS)
          mkdir "$RUNNER_TEMP/candidate-smoke"
          python3 packaging/safe-extract.py \
            "$RUNNER_TEMP/acceptance/fault-affinity-live-linux-x64.tar.gz" \
            "$RUNNER_TEMP/candidate-smoke"
          "$RUNNER_TEMP/candidate-smoke/fault-affinity/runtime/controller/bin/node" --version
          "$RUNNER_TEMP/candidate-smoke/fault-affinity/runtime/reference/bin/node" --version
          "$RUNNER_TEMP/candidate-smoke/fault-affinity/bin/run-reference" --help
          "$RUNNER_TEMP/candidate-smoke/fault-affinity/share/prepare-results" --help

      - name: Upload installable acceptance candidate
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
